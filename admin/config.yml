# Decap CMS (look & previews: admin/admin.css, admin/preview.js) — owners log in at /admin to edit content. Every save is a commit to the repo,
# and the host (Netlify / Cloudflare Pages) redeploys the site in ~1 minute.
backend:
  name: github
  repo: grigorovv/balkanmadness
  branch: main
  # base_url: https://your-oauth-proxy.example.com   # only needed when NOT hosting on Netlify

# Local testing: run `npx decap-server` in the project folder, then open http://localhost:8080/admin/
local_backend: true

site_url: https://balkanmadness.netlify.app
logo_url: /assets/logo.png
locale: en

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: events
    label: Events
    label_singular: Event
    description: "Upcoming vs. past is automatic: an event is featured while its date is today or later, then moves to Past events."
    folder: content/events
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{name}}"
    identifier_field: name
    summary: "{{date | date('D MMM YYYY')}} · {{name}}"
    sortable_fields: [date, name]
    view_groups:
      - { label: Year, field: date, pattern: "\\d{4}" }
    fields:
      - { label: Event name, name: name, widget: string, hint: "Shown in capitals on the site, e.g. STUDENTS WELCOME NIGHT" }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, picker_utc: true }
      - { label: Time, name: time, widget: string, required: false, hint: "e.g. 23:00–04:00 · from 23:00 · 20:00–23:00 (doors 19:00)" }
      - { label: Poster, name: image, widget: image, choose_url: false, hint: "JPG or WebP, ideally under 500 KB. Check the crop in the preview on the right." }
      - label: Poster crop
        name: pos
        widget: select
        default: center
        hint: Which part of the poster stays visible on the cards
        options:
          - { label: Center, value: center }
          - { label: Top, value: top }
          - { label: Upper middle, value: center 35% }
          - { label: Just above center, value: center 40% }
          - { label: Bottom, value: bottom }
          - { label: Left, value: left center }
          - { label: Right, value: right center }
      - { label: Type (label on past events), name: tag, widget: select, options: [PARTY, CONCERT, FESTIVAL], default: PARTY }
      - { label: Full venue / address, name: venue, widget: string, hint: "e.g. Effenaar Main Hall, Dommelstraat 2, Eindhoven" }
      - { label: Short venue (cards), name: venueShort, widget: string, hint: "e.g. Effenaar, Eindhoven" }
      - { label: Line-up, name: lineup, widget: string, required: false }
      - { label: Hosted by, name: hosts, widget: string, required: false }
      - { label: Description, name: description, widget: text }
      - { label: Ticket link, name: tickets, widget: string, required: false, hint: "Leave empty to hide the GET TICKETS button" }
      - { label: Facebook event link, name: fb, widget: string, required: false }

  - name: artists
    label: Artists
    files:
      - name: artists
        label: Artists
        file: content/artists.json
        fields:
          - label: Artists
            name: artists
            widget: list
            label_singular: artist
            summary: "{{fields.name}}"
            hint: Drag to reorder. Photos alternate left / right automatically.
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Photo, name: img, widget: image, required: false, choose_url: false }
              - { label: "Photo has a transparent background (PNG cut-out)", name: cutout, widget: boolean, default: false }
              - { label: Bio, name: bio, widget: text }

  - name: site
    label: Page text & contact
    files:
      - name: site
        label: Page text & contact
        file: content/site.json
        fields:
          - label: Hero photos
            name: heroImages
            widget: list
            label_singular: photo
            hint: "1 photo = static. 2 or more = automatic slideshow every 6 seconds."
            summary: "{{fields.image}}"
            fields:
              - { label: Photo, name: image, widget: image, choose_url: false }
          - { label: Hero tagline, name: tagline, widget: text }
          - { label: Hero TICKETS button link, name: ticketsUrl, widget: string, required: false, hint: "Leave empty to use the ticket link of the next upcoming event" }
          - { label: "Who we are — heading", name: whoHeading, widget: string }
          - { label: "Who we are — text", name: whoText, widget: text }
          - { label: Contact intro text, name: contactText, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Address, name: address, widget: string }
          - { label: Instagram link, name: instagram, widget: string }
          - { label: Facebook link, name: facebook, widget: string }
